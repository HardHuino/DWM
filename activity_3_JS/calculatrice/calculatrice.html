<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset = "utf-8"/>
    <title>Calculatrice</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Multiplications</h1>

    <p>Inscrire le résultat de la multiplication et appuyer sur le bouton "Vérifier".</p>
    <form>
    <div>
      <label for="reponse">
	      <span id="v1"></span> x <span id="v2"></span> =   <!-- Doit donner l'opération -->
      </label>
      <input type="text" name="reponse" size="3" maxlength="3" autofocus id = "reponse"/>
    </div>
    <div>
      <input type="button" value="Vérifier" id = "button"/>
    </div>
    </form>
    <div>
      Score: <span id="score"> </span> / <span id="total"> </span> 		<!-- Doit contenir le score / nombre total de réponses-->
    </div>
    <script>
      // var button = document.getElementById("button");
      // var reponse = document.getElementById("reponse");
      var scoreTotal=0;
      var scoreBon=0;
      button.addEventListener("click",verification);
      document.addEventListener("keydown", function(event) {
        if (event.key == "Enter") {
          verification();
        }
      });
      function hasard(n) {
        return Math.ceil(Math.random()*n);
      }
      function verification() {
        if (Number(reponse.value)==Number(v1.textContent)*Number(v2.textContent)) {
          alert("Bonne réponse!");
          updateScore(true);
          v1.textContent = hasard(10);
          v2.textContent = hasard(10);
        } else {
          alert("Mauvaise réponse, la bonne réponse était " + Number(v1.textContent)*Number(v2.textContent));
          updateScore(false);
          v1.textContent = hasard(10);
          v2.textContent = hasard(10);
        }
      }
      function updateScore(rep) {
        scoreTotal += 1;
        total.textContent=scoreTotal;
        if (rep) {
          scoreBon += 1;
          score.textContent=scoreBon;
        } else {
          score.textContent=scoreBon;
        }
        if (scoreBon/scoreTotal >= 1/2) {
          score.style.color = 'lightgreen';
        } else {
          score.style.color = 'red';
        }
      }
      v1.textContent = hasard(10);
      v2.textContent = hasard(10);
      
    </script>
  </body>
</html>
