    <div class="accordion accordion-flush" id="accordionFlushExample">
        <dl id="menu">
            <div class="accordion-item">
                <dt class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#flush-collapseOne" aria-expanded="false" aria-controls="flush-collapseOne">
                    <a href="#">Menu 1</a>
                </dt>
                <div id="flush-collapseOne" class="accordion-collapse collapse" data-bs-parent="#accordionFlushExample"></div>
            </div>
        
            <div class="accordion-item">
                <dt class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#flush-collapseTwo" aria-expanded="true" aria-controls="flush-collapseTwo">
                    Menu 2
                </dt>
                <div id="flush-collapseTwo" class="accordion-collapse collapse show" data-bs-parent="#accordionFlushExample">
                    <dd id="smenu2">
                        <ul class="accordion-body">
                            <li><a href="#">Sous-Menu 2.1</a></li>
                            <li><a href="#">Sous-Menu 2.2</a></li>
                            <li><a href="#">Sous-Menu 2.3</a></li>
                        </ul>
                    </dd>
                </div>
            </div>
        
            <div class="accordion-item">
                <dt class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#flush-collapseThree" aria-expanded="false" aria-controls="#flush-collapseThree">
                    Menu 3
                </dt>
                <div id="flush-collapseThree" class="accordion-collapse collapse" data-bs-parent="#accordionFlushExample"></div>
            </div>

            <div class="accordion-item">
                <dt class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#flush-collapseFour" aria-expanded="true" aria-controls="flush-collapseFour">
                    Menu 4
                </dt>
                <div id="flush-collapseFour" class="accordion-collapse collapse show" data-bs-parent="#accordionFlushExample">
                    <dd id="smenu4">
                        <ul class="accordion-body" id='Four'>
                            <li><a href="#">Sous-Menu 4.1</a></li>
                            <li><a href="#">Sous-Menu 4.2</a></li>
                        </ul>
                    </dd>
                </div>
            </div>
        
        </dl>
