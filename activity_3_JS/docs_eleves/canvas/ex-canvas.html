<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8">

    <title>Exemple d'utilisation du canvas</title>
  </head>

  <body>
    <p>Un petit exemple...</p>
    
    <canvas id="monCanvas" width="200" height="250" style="border:1px solid #dddddd;"></canvas>
    

    <script>
      // definition d'un type d'objet: carre
      function carre(width, height, color, x, y) {
      	// attributs de l'objet
      	this.width = width;
      	this.height = height;
      	this.x = x;
      	this.y = y;
      	// methodes de l'objet
      	this.update = function() {
      	  ctx.fillStyle = color;
      	  ctx.fillRect(this.x, this.y, this.width, this.height);
      	  }
      	this.clear = function() {
      	  ctx.fillStyle = "white";
      	  ctx.fillRect(this.x, this.y, this.width, this.height);
      	}
      }
      // fonction pour la mise a jour de l'affichage
      function miseAjour() {
      	carrevert.clear();
      	carrevert.x +=1;
      	if (carrevert.x == 200) {
      	  carrevert.x=-30;
      	  }
      	carrevert.update();
      }

      
      // programme principal
      var c = document.getElementById("monCanvas");
      var ctx = c.getContext("2d"); // creation d'un canvas 2D
      ctx.moveTo(0,0); // dessin de 2 droites
      ctx.lineTo(200,100);
      ctx.moveTo(0,100);
      ctx.lineTo(200,0);
      ctx.stroke(); // on affiche les 2 droites
      // creation d'un object de type carre
      carrevert = new carre(30, 30, "green", 10, 100);
      // execution de miseAjour toutes les 20ms
      //setInterval(miseAjour, 20);
      var VITESSE = 5;
      function droite() {
        if (carrevert.x <= 200-carrevert.width-VITESSE) {
          carrevert.clear();
          carrevert.x += VITESSE;
          carrevert.update();
        }
      }
      function gauche() {
        if (carrevert.x >= -30+carrevert.width+VITESSE) {
          carrevert.clear();
          carrevert.x -= VITESSE;
          carrevert.update();
        }
      }
      function haut() {
        if (carrevert.y >= -30+carrevert.height+VITESSE) {
          carrevert.clear();
          carrevert.y -= VITESSE;
          carrevert.update();
        }
      }
      function bas() {
        if (carrevert.y <= 250-carrevert.height-VITESSE) {
          carrevert.clear();
          carrevert.y += VITESSE;
          carrevert.update();
        }
      }

      document.addEventListener("keydown", function(event) {
        switch (event.key) {
          case "ArrowRight":
            droite();
            break;
          case "ArrowLeft":
            gauche();
            break;
          case "ArrowUp":
            haut();
            break;
          case "ArrowDown":
            bas();
            break;
        }
      });
    </script>
    

  </body>
</html>
