<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Formulaire accès station météo</title>
    <style>
        /* CSS pour les alignements, la boite etc ... */
        body {
            font-family: serif;
        }

        .box {
            width: 420px;
            border: 1px solid black;
            padding: 20px;
            margin: 40px auto;
        }

        h1 {
            font-size: 20px;
            text-align: center;
            margin-top: 0;
        }

        .row {
            margin: 10px 0;
            display: flex;
            justify-content: center;
        }

        .row label {
            width: 120px;
            text-align: right;
            margin-right: 10px;
        }

        .row input {
            width: 180px;
        }

        .submit-container {
            text-align: right;
            margin-top: 10px;
            padding-right: 40px;
        }
    </style>
</head>
    <body>
        <div class="box">
            <h1>Accès données station météo</h1>
            <form method="POST" action="acces.php">
                <div class="row">
                    <label>Identifiant:</label>
                    <input type="text" name="login">
                </div>
                <div class="row">
                    <label>Mot de passe:</label>
                    <input type="password" name="motdepasse">
                </div>
                <div class="submit-container">
                    <input type="submit" value="Envoyer">
                </div>
            </form>
        </div>
    </body>
</html>
